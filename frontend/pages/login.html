<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Среда</title>
  <meta name="theme-color" content="#fffbf5">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <script type="module" src="/assets/js/main.js"></script>
</head>
<body data-page="login">
  <header data-header data-minimal></header>

  <main class="container auth">
    <section class="auth__side" data-parallax-scope>
      <h1 class="display split-words">С возвращением<br>в Среду</h1>
      <p class="lead" data-reveal style="--d:.3s">Ваши люди и новые идеи уже здесь.</p>
      <div class="auth__art">
        <img class="float" data-parallax style="--depth:16px" src="/assets/img/illustrations/auth.webp" alt="" width="1600" height="1200" data-fb="art" data-variant="auth">
      </div>
    </section>

    <section class="auth__main">
      <form class="auth-form" data-auth-form="login" method="post" onsubmit="return false" novalidate data-reveal="right">
        <h2 class="auth-form__title">Войти</h2>
        <p class="lead">Продолжайте создавать вместе.</p>

        <button type="button" class="google-btn" data-google>
          <svg width="26" height="26" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          Продолжить с Google
        </button>
        <div data-demo-slot></div>
        <div class="divider">или по почте</div>

        <div class="field">
          <label class="field__label" for="email">Электронная почта</label>
          <input class="input" id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required>
          <div class="field__error" data-error="email"></div>
        </div>
        <div class="field">
          <label class="field__label" for="password">Пароль</label>
          <div class="input-wrap">
            <input class="input" id="password" name="password" type="password" placeholder="Введите пароль" autocomplete="current-password" required>
            <button type="button" class="input-wrap__btn" data-toggle-password aria-label="Показать пароль"><i data-icon="eye"></i></button>
          </div>
          <div class="field__error" data-error="password"></div>
        </div>

        <div class="auth-form__row">
          <label class="check"><input type="checkbox" name="remember"><span>Запомнить меня</span></label>
          <a class="link link--orange" href="#" data-forgot>Забыли пароль?</a>
        </div>

        <div class="form-error"></div>
        <button type="submit" class="btn btn--primary btn--block auth-form__submit">Войти</button>
        <p class="auth-form__alt">Нет аккаунта?<a class="link link--orange" href="/register">Зарегистрироваться</a></p>
      </form>
    </section>
  </main>
</body>
</html>
